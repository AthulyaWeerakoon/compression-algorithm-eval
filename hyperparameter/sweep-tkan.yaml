project: kan
program: tkan-hyperparameter.py
method: bayes
metric:
  name: mse_valid
  goal: minimize
parameters:
  hidden1:
    values: [4, 5, 6]
  hidden2:
    values: [2, 3, 4]
  hidden3:
    values: [0, 2] # 0 means skip this layer
  KAN_grid:
    values: [1, 2]
  KAN_k:
    values: [1, 2]
  random_seed:
    value: 42

